name: Rebuild Safety Gate

on:
  workflow_dispatch:
  push:
    branches:
      - opentune-rebuild-v1
  pull_request:
    branches:
      - opentune-rebuild-v1
    paths-ignore:
      - "assets/**"
      - "docs/**"
      - "fastlane/**"
      - "**/*.md"

concurrency:
  group: rebuild-safety-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Tests, Lint & Debug Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission to Gradle
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testUniversalDebugUnitTest --no-daemon --stacktrace

      - name: Run Android lint
        run: ./gradlew lintUniversalDebug --no-daemon --stacktrace

      - name: Build universal debug APK
        run: ./gradlew assembleUniversalDebug --no-daemon --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rebuild-lint-report
          path: |
            app/build/reports/lint-results-universalDebug.html
            app/build/reports/lint-results-universalDebug.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: OpenTune-rebuild-universal-debug
          path: app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
          retention-days: 14
