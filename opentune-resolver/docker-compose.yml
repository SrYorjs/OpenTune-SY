services:
  opentune-resolver:
    build: .
    container_name: opentune-resolver
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      # Atado a una sola IP (la de Tailscale). Docker ignora ufw, así que NO uses 0.0.0.0 en internet.
      - "${BIND_IP:-127.0.0.1}:8787:8787"
    environment:
      AUDIUS_API_KEY: "${AUDIUS_API_KEY:-}"
      PEERTUBE_INSTANCE: "${PEERTUBE_INSTANCE:-https://video.blender.org}"
      AUDIUS_R2_HOSTS: "${AUDIUS_R2_HOSTS:-}"
      HOME: /tmp
      XDG_CACHE_HOME: /tmp
      DENO_DIR: /tmp/deno
      PYTHONDONTWRITEBYTECODE: "1"
      API_KEY: "${API_KEY:?define API_KEY en el archivo .env}"
      # COOKIES_FILE: /data/cookies.txt     # opcional (cuenta Premium)
    # volumes:
    #   - ./data:/data
